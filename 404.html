<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      // CONFIGURATION: Set your new destination base domain here.
      // (It works perfectly whether you include a trailing slash or not)
      const NEW_DOMAIN = "https://nypl.github.io/metadata-documentation";

      // 1. Get the current path (e.g., "/metadata-documentation/metadata/")
      const currentPath = window.location.pathname;

      // 2. Safely strip the leading repo folder name and leave a predictable single path
      let cleanPath = currentPath.replace(/^\/[^\/]+/, '');

      // 3. Prevent double slashes if NEW_DOMAIN ends in a slash and cleanPath starts with one
      if (NEW_DOMAIN.endsWith('/') && cleanPath.startsWith('/')) {
        cleanPath = cleanPath.substring(1);
      } else if (!NEW_DOMAIN.endsWith('/') && !cleanPath.startsWith('/') && cleanPath !== '') {
        cleanPath = '/' + cleanPath;
      }

      // 4. Combine parts with query strings or hash tags safely
      const targetUrl = NEW_DOMAIN + cleanPath + window.location.search + window.location.hash;

      // 5. Fire the redirection
      window.location.replace(targetUrl);
    </script>
  </head>
  <body>
    <p>This page has moved. Redirecting you now... If you are not redirected, <a id="fallback-link" href="#">click here</a>.</p>
    <script>
      // Apply the same slash-safe logic directly to the visible fallback link
      let fallbackPath = window.location.pathname.replace(/^\/[^\/]+/, '');
      if (NEW_DOMAIN.endsWith('/') && fallbackPath.startsWith('/')) fallbackPath = fallbackPath.substring(1);
      if (!NEW_DOMAIN.endsWith('/') && !fallbackPath.startsWith('/') && fallbackPath !== '') fallbackPath = '/' + fallbackPath;
      
      document.getElementById("fallback-link").href = NEW_DOMAIN + fallbackPath;
    </script>
  </body>
</html>
